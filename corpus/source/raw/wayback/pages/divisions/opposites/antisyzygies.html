<H1>
102 ANTISYZYGIES (MEETING OF OPPOSITES)</H1></CENTER>

<CENTER>
<H2>
Foreward</H2></CENTER>
Antisyzygies are 'meetings of opposites'. Or more generally, they include
(any and all) [meetings, comparisons, unions, intersections, vergences,
equivalences, analogies, interdependences, complementarities, symmetries,
interactions, interweavings, dialectical syntheses and transcendences,
etc] of pairs (or larger sets) of mutually [opposite or contrasting] things.

<P>Arguably they are the most important things, or philosophical categories,
there are. Or this might be said of the progressive (finite or infinite)
INTEGRATION of the totality of all of the different sets of antisyzygies
in the paradoxical foundations of the universe, or of physical and mental
reality.

<P>A pertinent philosophical principle is, <I>"all opposites meet in and
as the greater nature of things."</I>

<P>The present list is actually an abbreviated version of a much larger
table of over 303 named antisyzygies. The original purpose of the paring
was simply to allow a hyperspatial mapping to be made of some diverse meetings
of opposites, via the statistical method of nonmetric multidimensional
scaling (NMDS), guided by holistic (gestalt) intuition.

<P>Absent here are even such major antisyzygies as 'Ability &lt;--> Inability',
'Absolute &lt;--> Relative', and 'Active &lt;--> Passive'; not to mention
numberless minor ones, such as 'Acceleration &lt;--> Deceleration', 'Ambiguous
&lt;--> Unambiguous', or 'Cold &lt;--> Hot'.&nbsp;
