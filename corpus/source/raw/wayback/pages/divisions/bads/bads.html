<H1>
152 Generic Bads</H1></CENTER>

<CENTER><B>FORWARD</B></CENTER>
In ideonomy the concept of bad is general, even universal or common to
all things. 'Bad', in this enlarged sense, might be defined as whatever
is [harmful, costly, destructive, negative, undesirable, wrong, evil, or
the like] - to anything whatever - in any way - in any degree. The term
may apply both to animate and inanimate phenomena, or to 'their point of
view'. The concept of bad is purely relative, except insofar as various
ideonomic integrals may be taken over all identifiable bads, integrals
which can then compete for the supreme degree of goodness.
